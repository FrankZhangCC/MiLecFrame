colors:
  text: '#000000'
  custom_timestamp_author_light_color: [51, 51, 51]
  custom_timestamp_author_dark_color: [204, 204, 204]
  custom_location_light_color: [51, 51, 51]
  custom_location_dark_color: [204, 204, 204]
fonts:
  family: Gotham
  weight: medium
  size_ratio: 0.01
  sizes:
    exif: 0.018
    timestamp_author: 0.018
    camera_lens: 0.018
    location: 0.018
layout:
  expand_canvas:
    enabled: true
    top: 0.05
    bottom: 0.13
    left: 0.025
    right: 0.025
  padding:
    top: 0.025
    bottom: 0.025
    left: 0.025
    right: 0.025
  info_position:
    exif:
      position: "bottom-left"
      alignment: "left"
      margin_top: 0
      margin_bottom: 0.02
      margin_left: 0
      margin_right: 0
    timestamp_author:
      relative_to: "exif"
      relative_position: "below"
      alignment: "left"
      relative_margin: 0.01
    camera_lens:
      position: "bottom-right"
      alignment: "right"
      margin_top: 0
      margin_bottom: 0.02
      margin_left: 0
      margin_right: 0
    location:
      relative_to: "camera_lens"
      relative_position: "below"
      alignment: "right"
      relative_margin: 0.01
logo:
  enabled: false
name: 宝丽来风格 Polaroid
