# ============================================================
# 扩展宝丽来风格 Polaroid Motto
# 基于"宝丽来风格 Polaroid"扩展，新增预定义文本和自定义文本功能
# ============================================================

name: 扩展宝丽来风格 Polaroid Motto

# ---- 颜色配置 ----
colors:
  text: '#000000'
  custom_timestamp_author_light_color: [51, 51, 51]
  custom_timestamp_author_dark_color: [204, 204, 204]
  custom_location_light_color: [51, 51, 51]
  custom_location_dark_color: [204, 204, 204]
  # defined_texts 元素的颜色（浅色背景深灰，深色背景浅灰）
  custom_defined_text_01_light_color: [51, 51, 51]
  custom_defined_text_01_dark_color: [204, 204, 204]
  custom_defined_text_02_light_color: [51, 51, 51]
  custom_defined_text_02_dark_color: [204, 204, 204]
  custom_defined_text_03_light_color: [51, 51, 51]
  custom_defined_text_03_dark_color: [204, 204, 204]
  custom_defined_text_04_light_color: [51, 51, 51]
  custom_defined_text_04_dark_color: [204, 204, 204]
  custom_custom_text_light_color: [51, 51, 51]
  custom_custom_text_dark_color: [204, 204, 204]

# ---- 字体配置 ----
fonts:
  family: Gotham
  weight: medium
  size_ratio: 0.01
  line_spacing_ratio: 0.008     # 多行文本默认行间距（相对于原图短边）
  sizes:
    exif: 0.018
    timestamp_author: 0.018
    camera_lens: 0.018
    location: 0.018
    defined_text_01: 0.018
    defined_text_02: 0.018
    defined_text_03: 0.018
    defined_text_04: 0.018
    custom_text: 0.015

# ---- 布局配置 ----
layout:
  expand_canvas:
    enabled: true
    top: 0.08
    bottom: 0.2
    left: 0.05
    right: 0.05
  padding:
    top: 0.025
    bottom: 0.025
    left: 0.05
    right: 0.05

  # --- 相机信息文本（与原宝丽来风格一致）---
  info_position:
    exif:
      position: "bottom-left"
      alignment: "left"
      margin_top: 0
      margin_bottom: 0.035
      margin_left: 0
      margin_right: 0
    timestamp_author:
      relative_to: "exif"
      relative_position: "below"
      alignment: "left"
      relative_margin: 0.015
    camera_lens:
      position: "bottom-right"
      alignment: "right"
      margin_top: 0
      margin_bottom: 0.035
      margin_left: 0
      margin_right: 0
    location:
      relative_to: "camera_lens"
      relative_position: "below"
      alignment: "right"
      relative_margin: 0.015

  # --- 预定义文本：四段固定内容，编码编号命名避免 key 冲突 ---
  defined_texts:
    defined_text_01:
      content: "FL"
      position: "bottom-left"
      alignment: "bottom"
      margin_bottom: 0.080
    defined_text_02:
      content: "shutter"
      relative_to: "defined_text_01"
      relative_position: "right-of"
      alignment: "bottom"
      relative_margin: 0.008
      offset_y_ratio: 0.0
    defined_text_03:
      content: "aperture"
      relative_to: "defined_text_02"
      relative_position: "right-of"
      alignment: "bottom"
      relative_margin: 0.008
    defined_text_04:
      content: "ISO"
      relative_to: "defined_text_03"
      relative_position: "right-of"
      alignment: "bottom"
      relative_margin: 0.008

  # --- 自定义文本：用户在 GUI 中输入内容 ---
  custom_text:
    enabled: true
    position: "bottom-center"
    alignment: "center"
    line_spacing_ratio: 0.008      # 覆盖全局行间距
    margin_bottom: 0.125

# ---- Logo ----
logo:
  enabled: false
