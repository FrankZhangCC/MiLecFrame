# 验证此配置是否被使用：此配置文件设置了非常大的字体大小比例
# 如果渲染结果中文字仍然很小，说明此配置文件可能未被使用
colors:
  accent: '#A52A2A'
  background: '#F5F5DC'
  border: '#8B4513'
  text: '#000000'
  custom_timestamp_light_color: [51, 51, 51]   # 亮色背景下时间戳颜色
  custom_timestamp_dark_color: [204, 204, 204]    # 暗色背景下时间戳颜色
  custom_location_light_color: [51, 51, 51]  # 亮色背景下地点颜色
  custom_location_dark_color: [204, 204, 204]     # 暗色背景下地点颜色
description: 经典复古风格 - 默认样式
effects:
- vintage_filter
fonts:
  regular: Gotham-Medium
  size_ratio: 0.02
  sizes:
    exif: 0.02  # 改为2%原图长边
    timestamp: 0.02  # 拍摄时间的字体大小
    camera: 0.02   # 相机型号的字体大小
    lens: 0.02     # 镜头型号的字体大小
    author: 0.02
    location: 0.02
  line_spacing: 1.5
layout:
  border_position: inner
  border_width: 10
  expand_canvas:
    enabled: true
    top: 0.08
    bottom: 0.12
    left: 0.03
    right: 0.03
  info_height_ratio: 0.0125
  info_position:
    exif:
      position: "outside"
      alignment: "center"
      margin_top: 0.01    # 顶部边距
      margin_bottom: 0.03 # 底部边距
      margin_left: 0.01   # 左边距
      margin_right: 0.01  # 右边距
    timestamp:
      position: "outside"
      alignment: "center"
      margin_top: 0.01    # 顶部边距
      margin_bottom: 0.06 # 底部边距
      margin_left: 0.01   # 左边距
      margin_right: 0.01  # 右边距
      relative_to: "exif"        # 相对于exif元素
      relative_position: "below" # 位于exif下方
      relative_margin: 0.02      # 与exif的间距为原图长边的2%
    camera:
      position: "outside"
      alignment: "top-left"
      margin_top: 0.02    # 顶部边距
      margin_bottom: 0.01 # 底部边距
      margin_left: 0.00   # 左边距
      margin_right: 0.01  # 右边距
    lens:
      position: "outside"
      alignment: "top-left"
      margin_top: 0.045   # 顶部边距
      margin_bottom: 0.01 # 底部边距
      margin_left: 0.00   # 左边距
      margin_right: 0.01  # 右边距
    author:
      position: "outside"
      alignment: "left"
      margin_top: 0.01    # 顶部边距
      margin_bottom: 0.03 # 底部边距
      margin_left: 0      # 左边距 - 修改为0
      margin_right: 0.01  # 右边距
    location:
      position: "outside"
      alignment: "right"
      margin_top: 0.01    # 顶部边距
      margin_bottom: 0.03 # 底部边距
      margin_left: 0.01   # 左边距
      margin_right: 0     # 右边距 - 修改为0
    camera_icon:
      position: "outside"
      alignment: "top-left"
      margin_top: 0.02    # 顶部边距
      margin_bottom: 0.01 # 底部边距
      margin_left: 0.02   # 左边距
      margin_right: 0.01  # 右边距
background_fill:
  type: "gaussian_black_35"  # 35%透明度
  gaussian_blur_radius: 200
  gaussian_blur_opacity: 35
logo:
  enabled: true
  position: "top-right"
  alignment: "top-right"
  size_ratio: 0.04  # Logo高度为原图长边的3%
  margin_top: 0.02
  margin_bottom: 0.01
  margin_left: 0.01
  margin_right: 0    # 右边距设为0
name: Default_TestFrame