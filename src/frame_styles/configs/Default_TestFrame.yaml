# 验证此配置是否被使用：此配置文件设置了非常大的字体大小比例
# 如果渲染结果中文字仍然很小，说明此配置文件可能未被使用
colors:
  text: '#000000'
  custom_timestamp_light_color: [51, 51, 51]
  custom_timestamp_dark_color: [204, 204, 204]
  custom_location_light_color: [51, 51, 51]
  custom_location_dark_color: [204, 204, 204]
fonts:
  family: Gotham
  weight: medium
  size_ratio: 0.02
  sizes:
    exif: 0.02
    timestamp: 0.02
    camera: 0.02
    lens: 0.02
    author: 0.02
    location: 0.02
layout:
  expand_canvas:
    enabled: true
    top: 0.08
    bottom: 0.12
    left: 0.03
    right: 0.03
  padding:
    left: 0.05
    right: 0.05
    top: 0.00
    bottom: 0.00
  info_position:
    exif:
      position: "bottom-right"
      alignment: "center"
      margin_top: 0.01
      margin_bottom: 0.03
      margin_left: 0.01
      margin_right: 0.01
    timestamp:
      relative_to: "author"
      relative_position: "below"
      alignment: "left"
      relative_margin: 0.02
    camera:
      position: "outside"
      alignment: "top-left"
      margin_top: 0.02
      margin_bottom: 0.01
      margin_left: 0.00
      margin_right: 0.01
    lens:
      position: "outside"
      alignment: "top-left"
      margin_top: 0.045
      margin_bottom: 0.01
      margin_left: 0.00
      margin_right: 0.01
    author:
      position: "outside"
      alignment: "left"
      margin_top: 0.01
      margin_bottom: 0.03
      margin_left: 0
      margin_right: 0.01
    location:
      relative_to: "exif"
      relative_position: "below"
      alignment: "left"
      relative_margin: 0.02
    camera_icon:
      position: "outside"
      alignment: "top-left"
      margin_top: 0.02
      margin_bottom: 0.01
      margin_left: 0.02
      margin_right: 0.01
background_fill:
  type: "gaussian_black_35"
  gaussian_blur_radius: 200
  gaussian_blur_opacity: 35
logo:
  enabled: true
  position: "top-right"
  alignment: "top-right"
  size_ratio: 0.04
  margin_top: 0.02
  margin_bottom: 0.01
  margin_left: 0.01
  margin_right: 0
name: Default_TestFrame
