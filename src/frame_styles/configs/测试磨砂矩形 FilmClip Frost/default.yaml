# ============================================================
# 测试样式：磨砂矩形 FilmClip Frost（以胶片夹风格 FilmClip 为基础）
# - 保留 FilmClip 全部排版（宝丽来画布 / 原图圆角 / 底部 EXIF / 顶部自定义文本）
# - 新增 v2.6 效果栈矩形 rect_01：
#     照片内部底部一条磨砂玻璃色块
#     = 高斯模糊底层（radius 200）+ 50% 颜色叠加（opacity 0.5）
#     显式写出 fill: 字段 → 矩形迁移到原图上方效果栈（照片内可见）
# 注意：这是临时测试样式，测试完毕可整目录删除。
# ============================================================

name: 测试磨砂矩形 FilmClip Frost

colors:
  text: '#000000'
  custom_timestamp_author_light_color: [51, 51, 51]
  custom_timestamp_author_dark_color: [204, 204, 204]
  custom_location_light_color: [51, 51, 51]
  custom_location_dark_color: [204, 204, 204]
  custom_defined_text_01_light_color: [51, 51, 51]
  custom_defined_text_01_dark_color: [204, 204, 204]
  custom_defined_text_02_light_color: [51, 51, 51]
  custom_defined_text_02_dark_color: [204, 204, 204]
  custom_defined_text_03_light_color: [51, 51, 51]
  custom_defined_text_03_dark_color: [204, 204, 204]
  custom_defined_text_04_light_color: [51, 51, 51]
  custom_defined_text_04_dark_color: [204, 204, 204]

  # ── 磨砂矩形的填充颜色（明暗背景自适应） ──
  custom_rect_01_light_color: [255, 255, 255]
  custom_rect_01_dark_color: [20, 20, 20]
  # ── 磨砂矩形的描边颜色（独立明暗自适应；内描边不改变矩形尺寸） ──
  custom_rect_01_stroke_light_color: [51, 51, 51]
  custom_rect_01_stroke_dark_color: [235, 235, 235]

fonts:
  latin:
    family: Gotham
    weight: medium
    weights:
      light: Light
      regular: Book
      medium: Medium
  cjk:
    family: GlowSansSC-Normal
    weight: medium
    weights:
      light: Light
      regular: Regular
      medium: Medium
  size_ratio: 0.01
  line_spacing_ratio: 0.008
  sizes:
    defined_text_01: 0.027
    defined_text_02: 0.027
    defined_text_03: 0.027
    defined_text_04: 0.027
    camera_lens: 0.027
    focal_length_formatted: 0.027
    aperture_formatted: 0.027
    shutter_speed_formatted: 0.027
    iso_formatted: 0.027
    custom_text: 0.027

layout:
  expand_canvas:
    enabled: true
    top: 0.25
    bottom: 0.25
    left: 0.07
    right: 0.07
  padding:
    top: 0.025
    bottom: 0.025
    left: 0.07
    right: 0.07

  corner_radius:
    enabled: true
    top_left: 0.02
    top_right: 0.02
    bottom_left: 0.02
    bottom_right: 0.02

  # ── 自定义矩形：磨砂玻璃色块（v2.6 效果栈） ──
  rectangles:
    rect_01:
      width_ratio: 0.9            # 相对原图短边的宽度
      height_ratio: 0.12          # 相对原图短边的高度
      opacity: 0.5                # 颜色叠加强度 50%（只作用于填充层，
                                  #   模糊层保持 100% 不透明）
      placement: inside           # 照片内部
      position: bottom-center
      alignment: bottom-center
      margin_bottom: 0.04
      corner_radius:              # 四角圆角的磨砂玻璃块
        top_left: 0.015
        top_right: 0.015
        bottom_left: 0.015
        bottom_right: 0.015

      fill:                       # 显式写出 → 进入效果栈（原图上方）
        enabled: true
      gaussian_blur:              # 底层磨砂模糊
        enabled: true
        radius: 200               # 与背景默认半径一致，利于共享卷积缓存
      stroke:                     # 顶部内描边（模糊 → 填充 → 描边 的最上层）
        enabled: true
        radius_ratio: 0.005       # 厚度相对原图短边（内描边，不改变矩形外部尺寸）
        opacity: 0.90             # 描边独立透明度，不复用填充的 opacity

  info_position:
    camera_lens:
      position: "bottom-center"
      alignment: "top-center"
      margin_top: 0
      margin_bottom: 0.075
      margin_left: 0
      margin_right: 0
    focal_length_formatted:
      relative_to: "defined_text_01"
      relative_position: "right-of"
      cross_alignment: "center"
      relative_margin: 0.01
    aperture_formatted:
      relative_to: "defined_text_02"
      relative_position: "right-of"
      cross_alignment: "center"
      relative_margin: 0.01
    shutter_speed_formatted:
      relative_to: "defined_text_03"
      relative_position: "right-of"
      cross_alignment: "center"
      relative_margin: 0.01
    iso_formatted:
      relative_to: "defined_text_04"
      relative_position: "right-of"
      cross_alignment: "center"
      relative_margin: 0.01

  defined_texts:
    defined_text_01:
      content: "FL"
      position: "bottom-center"
      alignment: "top-center"
      tree_align: true
      margin_bottom: 0.13
    defined_text_02:
      content: "Aperture"
      relative_to: "focal_length_formatted"
      relative_position: "right-of"
      cross_alignment: "center"
      relative_margin: 0.04
    defined_text_03:
      content: "Shutter"
      relative_to: "aperture_formatted"
      relative_position: "right-of"
      cross_alignment: "center"
      relative_margin: 0.04
    defined_text_04:
      content: "ISO"
      relative_to: "shutter_speed_formatted"
      relative_position: "right-of"
      cross_alignment: "center"
      relative_margin: 0.04

  # ── 自定义文本（替换原 Logo 的顶部居中定位） ──
  custom_text:
    enabled: true
    position: "top-center"
    alignment: "center"
    margin_top: 0.11
    line_spacing_ratio: 0.006

logo:
  enabled: false
