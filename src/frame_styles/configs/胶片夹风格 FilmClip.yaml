# ============================================================
# 扩展宝丽来风格 Polaroid Motto (v1.7.0)
# 基于"宝丽来风格 Polaroid"扩展，包含：
#   - 独立格式化 EXIF 字段（焦距/光圈/快门/ISO）
#   - 预定义文本标签（FL/Aperture/Shutter/ISO）
#   - 依赖树组合定位（整链居中）
#   - 自定义文本
# ============================================================

name: 扩展宝丽来风格 Polaroid Motto

colors:
  text: '#000000'
  custom_timestamp_author_light_color: [51, 51, 51]
  custom_timestamp_author_dark_color: [204, 204, 204]
  custom_location_light_color: [51, 51, 51]
  custom_location_dark_color: [204, 204, 204]
  # defined_texts 元素颜色
  custom_defined_text_01_light_color: [51, 51, 51]
  custom_defined_text_01_dark_color: [204, 204, 204]
  custom_defined_text_02_light_color: [51, 51, 51]
  custom_defined_text_02_dark_color: [204, 204, 204]
  custom_defined_text_03_light_color: [51, 51, 51]
  custom_defined_text_03_dark_color: [204, 204, 204]
  custom_defined_text_04_light_color: [51, 51, 51]
  custom_defined_text_04_dark_color: [204, 204, 204]

fonts:
  latin:
    family: Gotham
    weight: medium
    weights:
      light: Light
      regular: Book
      medium: Medium
  cjk:
    family: GlowSansSC-Normal
    weight: medium
    weights:
      light: Light
      regular: Regular
      medium: Medium
  size_ratio: 0.01
  line_spacing_ratio: 0.008
  sizes:
    defined_text_01: 0.022
    defined_text_02: 0.022
    defined_text_03: 0.022
    defined_text_04: 0.022
    camera_lens: 0.022
    focal_length_formatted: 0.022
    aperture_formatted: 0.022
    shutter_speed_formatted: 0.022
    iso_formatted: 0.022
    custom_text: 0.022

layout:
  expand_canvas:
    enabled: true
    top: 0.175
    bottom: 0.225
    left: 0.05
    right: 0.05
  padding:
    top: 0.025
    bottom: 0.025
    left: 0.05
    right: 0.05

  corner_radius:
    enabled: true
    top_left: 0.02
    top_right: 0.02
    bottom_left: 0.02
    bottom_right: 0.02

  # ── 独立格式化 EXIF 字段（组件，不独立出现）──
  info_position:
    camera_lens:
      position: "bottom-center"
      alignment: "center"
      margin_top: 0
      margin_bottom: 0.07
      margin_left: 0
      margin_right: 0
    focal_length_formatted:
      relative_to: "defined_text_01"
      relative_position: "right-of"
      alignment: "left"
      relative_margin: 0.01
    aperture_formatted:
      relative_to: "defined_text_02"
      relative_position: "right-of"
      alignment: "left"
      relative_margin: 0.01
    shutter_speed_formatted:
      relative_to: "defined_text_03"
      relative_position: "right-of"
      alignment: "left"
      relative_margin: 0.01
    iso_formatted:
      relative_to: "defined_text_04"
      relative_position: "right-of"
      alignment: "left"
      relative_margin: 0.01

  # ── 预定义文本标签（构成链的骨架）──
  defined_texts:
    defined_text_01:
      content: "FL"
      position: "bottom"
      alignment: "center"
      tree_align: true
      margin_bottom: 0.11
    defined_text_02:
      content: "Aperture"
      relative_to: "focal_length_formatted"
      relative_position: "right-of"
      alignment: "left"
      relative_margin: 0.04
    defined_text_03:
      content: "Shutter"
      relative_to: "aperture_formatted"
      relative_position: "right-of"
      alignment: "left"
      relative_margin: 0.04
    defined_text_04:
      content: "ISO"
      relative_to: "shutter_speed_formatted"
      relative_position: "right-of"
      alignment: "left"
      relative_margin: 0.04

  # ── 自定义文本 ──
  custom_text:
    enabled: true
    position: "top-center"
    alignment: "center"
    line_spacing_ratio: 0.006
    margin_top: 0.05

logo:
  enabled: false
