# ============================================================
# 底部信息条 Bottom Bars — no_timestamp_author 变体
#
# 变体条件：timestamp_author 组合字段无值（拍摄时间与作者均缺失，
# 即组合字段三段 fallback 的"情况4：两者都没有"），而地点（location）
# 有值时自动选用。
#
# 布局基于 no_location 变体：
# - 左列 camera_lens 单行，margin_bottom 0.044（沿用 no_location 的
#   下沉值，与右列两行形成视觉配平）；
# - 右列 exif 上行（margin_bottom 0.028），第二行为 location 字段
#   （relative_to exif、在其下方、左缘对齐、相对间距 0.010）。
#
# 时间与作者均缺失时 timestamp_author 组合字段无内容可渲染 → 整行
# 不渲染，该位置由 location 接管。注意：仅作者缺失或仅时间缺失时
# 不匹配本变体——组合字段的 fallback 会自动降级为纯时间 / "Shot by
# 作者"，行结构与 default 一致，无需换布局（fallback 归一设计）。
# 按变体精简规范，author 相关的 custom_timestamp_author_* 颜色与
# fonts.sizes.timestamp_author 已移除。
# ============================================================
colors:
  text: '#000000'
  custom_location_light_color: [51, 51, 51]
  custom_location_dark_color: [204, 204, 204]
fonts:
  latin:
    family: Gotham
    weight: medium
    weights:
      light: Light
      regular: Book
      medium: Medium
  cjk:
    family: GlowSansSC-Normal
    weight: medium
    weights:
      light: Light
      regular: Regular
      medium: Medium
  size_ratio: 0.02
  sizes:
    camera_lens: 0.019
    exif: 0.019
    location: 0.015
layout:
  expand_canvas:
    enabled: true
    top: 0.0
    bottom: 0.105
    left: 0.00
    right: 0.00
  padding:
    left: 0.04
    right: 0.04
    top: 0.00
    bottom: 0.00
  info_position:
    camera_lens:
      placement: outside
      position: "bottom-left"
      alignment: "top-left"
      margin_top: 0.01
      margin_bottom: 0.044
      margin_left: 0.02
      margin_right: 0.01
    # 原 timestamp_author 条目位置原样换为 location：挂在 exif 下方，
    # 左缘对齐，相对间距 0.010（即右列第二行）
    location:
      relative_to: "exif"
      relative_position: "below"
      cross_alignment: "left"
      relative_margin: 0.010
    exif:
      placement: outside
      position: "bottom-right"
      alignment: "top-right"
      margin_top: 0.01
      margin_bottom: 0.028
      margin_left: 0.01
      margin_right: 0.02
logo:
  enabled: true
  relative_to: "exif"
  relative_position: "left-of"
  cross_alignment: "center"
  relative_margin: 0.016
  size_ratio: 0.048
  offset_y_ratio: 0.011
  max_dim_limit_ratio: 2.5
name: 底部信息条 BottomBars
